name: PriceWatch — Price Tracker

on:
  schedule:
    - cron: '0 */6 * * *'       # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Prices
        run: python .github/scripts/fetch.py

      - name: Commit & Push
        run: |
          git config user.name "PriceWatch Bot"
          git config user.email "bot@pricewatch.local"
          git add data/ reports/
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "📊 Auto: price update $(date -u +%Y-%m-%d_%H:%M)"
            git push
          )
