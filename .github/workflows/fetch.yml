name: DevPulse — Content Idea Engine

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate Blog Posts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p _posts
          python .github/scripts/fetch.py
      - name: Commit & Push
        run: |
          git config user.name "DevPulse Bot"
          git config user.email "bot@devpulse.local"
          git pull origin main --rebase || true
          git add -A
          git diff --cached --quiet && echo "No new articles" || (
            git commit -m "📰 Auto: trend-based article $(date -u +%Y-%m-%d_%H:%M)" && git push
          )
